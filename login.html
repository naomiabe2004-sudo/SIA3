<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechKeep | Seller and Admin Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f3f3ef; color: #111; min-height: 100vh; }
  .header { height: 78px; display: flex; align-items: center; padding: 0 5vw; background: #fff; border-bottom: 1px solid #ddd; }
  .brand { font-size: 28px; font-weight: 900; letter-spacing: -2px; }
  .page { display: flex; justify-content: center; align-items: center; padding: 50px 20px; }
  .wrapper { width: 100%; max-width: 980px; display: grid; grid-template-columns: 1fr 1fr; background: #fff; border: 1px solid #ddd; }
  .intro { min-height: 600px; padding: 55px; display: flex; flex-direction: column; justify-content: space-between; background: #111; color: #fff; }
  .intro-small { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; }
  .intro-title { font-size: clamp(40px, 6vw, 68px); line-height: .9; letter-spacing: -3px; }
  .intro-text { max-width: 350px; color: #aaa; font-size: 12px; line-height: 1.7; }
  .box { padding: 55px 45px; }
  .title { font-size: 34px; letter-spacing: -2px; margin-bottom: 8px; }
  .subtitle { color: #777; font-size: 12px; line-height: 1.5; margin-bottom: 30px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid #ccc; margin-bottom: 28px; }
  .tab { padding: 14px 5px; border: 0; border-bottom: 2px solid transparent; background: transparent; cursor: pointer; font-size: 10px; font-weight: 900; letter-spacing: 1px; }
  .tab.active { border-bottom-color: #111; }
  .form { display: none; }
  .form.active { display: block; }
  .field { margin-bottom: 17px; }
  .field label { display: block; margin-bottom: 7px; font-size: 9px; font-weight: 900; letter-spacing: 1px; }
  .field input { width: 100%; height: 48px; padding: 0 13px; border: 1px solid #ccc; background: #fff; font-size: 13px; outline: none; }
  .field input:focus { border-color: #111; }
  .password-row { position: relative; }
  .password-row input { padding-right: 65px; }
  .show-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; font-size: 8px; font-weight: 900; }
  .submit { width: 100%; height: 52px; border: 0; background: #111; color: #fff; cursor: pointer; font-size: 10px; font-weight: 900; letter-spacing: 1.2px; margin-top: 6px; }
  .submit:hover { background: #333; }
  .submit:disabled { background: #888; cursor: wait; }
  .message { min-height: 20px; margin-top: 12px; font-size: 11px; font-weight: 700; line-height: 1.5; }
  .message.error { color: #b00020; }
  .message.success { color: #237000; }
  @media (max-width: 750px) {
    .wrapper { grid-template-columns: 1fr; }
    .intro { min-height: 260px; padding: 35px; }
    .box { padding: 35px 25px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="brand">TechKeep</div>
</header>

<main class="page">
  <div class="wrapper">
    <section class="intro">
      <div class="intro-small">TECHKEEP / SELLER PORTAL</div>
      <h1 class="intro-title">SELL.<br>MANAGE.<br>GROW.</h1>
      <p class="intro-text">
        Sign in to manage your products and track your sales.
        This site is for sellers and administrators only.
      </p>
    </section>

    <section class="box">
      <h2 class="title">WELCOME.</h2>
      <p class="subtitle">Sign in to your account or create a seller account.</p>

      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">LOG IN</button>
        <button class="tab" id="signupTab" type="button">SIGN UP</button>
      </div>

      <form class="form active" id="loginForm">
        <div class="field">
          <label for="loginEmail">EMAIL</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="loginPassword">PASSWORD</label>
          <div class="password-row">
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
            <button type="button" class="show-password" data-target="loginPassword">SHOW</button>
          </div>
        </div>
        <button type="submit" class="submit" id="loginBtn">LOG IN →</button>
        <div class="message" id="loginMessage"></div>
      </form>

      <form class="form" id="signupForm">
        <div class="field">
          <label for="signupName">FULL NAME</label>
          <input type="text" id="signupName" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="signupEmail">EMAIL</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="signupPassword">PASSWORD (AT LEAST 6 CHARACTERS)</label>
          <div class="password-row">
            <input type="password" id="signupPassword" placeholder="Create a password" required>
            <button type="button" class="show-password" data-target="signupPassword">SHOW</button>
          </div>
        </div>
        <div class="field">
          <label for="signupConfirm">CONFIRM PASSWORD</label>
          <input type="password" id="signupConfirm" placeholder="Confirm your password" required>
        </div>
        <button type="submit" class="submit" id="signupBtn">CREATE SELLER ACCOUNT →</button>
        <div class="message" id="signupMessage"></div>
      </form>
    </section>
  </div>
</main>

<script>
  // ===== SETTINGS =====
const API_URL = "https://backend-2-h20j.onrender.com";12
  const TOKEN_KEY = "token";
  const USER_KEY = "user";
  // ====================

  const $ = (id) => document.getElementById(id);

  function goHome(user) {
    window.location.href = user.role === "admin" ? "admin.html" : "seller.html";
  }

  // Already logged in? Go straight to the right page.
  try {
    const savedUser = JSON.parse(localStorage.getItem(USER_KEY));
    if (localStorage.getItem(TOKEN_KEY) && savedUser && savedUser.role !== "buyer") {
      goHome(savedUser);
    }
  } catch (e) {}

  async function post(path, body) {
    const res = await fetch(API_URL + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, data };
  }

  function show(el, text, type) {
    el.textContent = text;
    el.className = "message " + type;
  }

  // Tabs
  $("loginTab").onclick = () => {
    $("loginTab").classList.add("active");
    $("signupTab").classList.remove("active");
    $("loginForm").classList.add("active");
    $("signupForm").classList.remove("active");
  };
  $("signupTab").onclick = () => {
    $("signupTab").classList.add("active");
    $("loginTab").classList.remove("active");
    $("signupForm").classList.add("active");
    $("loginForm").classList.remove("active");
  };

  // Show/hide password
  document.querySelectorAll(".show-password").forEach((btn) => {
    btn.onclick = () => {
      const input = $(btn.dataset.target);
      const hidden = input.type === "password";
      input.type = hidden ? "text" : "password";
      btn.textContent = hidden ? "HIDE" : "SHOW";
    };
  });

  // Log in (shared by login and signup)
  async function doLogin(email, password, messageEl) {
    const r = await post("/api/auth/login", { email, password });
    if (!r.ok) {
      show(messageEl, r.data.message || "Login failed.", "error");
      return false;
    }
    if (r.data.user.role === "buyer") {
      show(messageEl, "This website is for sellers and admins only. Please use the mobile app.", "error");
      return false;
    }
    localStorage.setItem(TOKEN_KEY, r.data.token);
    localStorage.setItem(USER_KEY, JSON.stringify(r.data.user));
    show(messageEl, "Login successful!", "success");
    setTimeout(() => goHome(r.data.user), 500);
    return true;
  }

  // LOGIN
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("loginMessage");
    const btn = $("loginBtn");
    btn.disabled = true;
    try {
      await doLogin($("loginEmail").value.trim().toLowerCase(), $("loginPassword").value, msg);
    } catch (err) {
      show(msg, "Cannot reach the server. Is it running?", "error");
    }
    btn.disabled = false;
  });

  // SIGN UP (seller accounts only)
  $("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("signupMessage");
    const btn = $("signupBtn");

    const name = $("signupName").value.trim();
    const email = $("signupEmail").value.trim().toLowerCase();
    const password = $("signupPassword").value;

    if (password !== $("signupConfirm").value) {
      show(msg, "Passwords do not match.", "error");
      return;
    }
    if (password.length < 6) {
      show(msg, "Password must be at least 6 characters.", "error");
      return;
    }

    btn.disabled = true;
    try {
      const r = await post("/api/auth/register", { name, email, password, role: "seller" });
      if (!r.ok) {
        show(msg, r.data.message || "Sign up failed.", "error");
      } else {
        await doLogin(email, password, msg);
      }
    } catch (err) {
      show(msg, "Cannot reach the server. Is it running?", "error");
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
